name: go
on:
  push:
    paths: ['go/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/go.yml']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Cross-compile every target
        env:
          CGO_ENABLED: '0'
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/386 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
              -o ../dist/isardvdi-$os-$arch$ext ./cmd/isardvdi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: isardvdi
          path: dist/*
